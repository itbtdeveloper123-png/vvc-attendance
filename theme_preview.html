<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Home Screen Preview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .phone-frame {
            width: 320px;
            height: 650px;
            background: #000;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }
        
        .phone-screen {
            width: 100%;
            height: 100%;
            background: #111827;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
        }
        
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: white;
            font-size: 14px;
        }
        
        .app-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .app-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        
        .app-name {
            color: var(--text-primary-color);
            font-size: 18px;
            font-weight: bold;
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px;
        }
        
        .quick-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background: var(--card-color);
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .quick-action:hover {
            transform: scale(1.05);
        }
        
        .quick-action-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            margin-bottom: 8px;
        }
        
        .quick-action-label {
            color: var(--text-secondary-color);
            font-size: 12px;
            text-align: center;
        }
        
        .today-section {
            padding: 20px;
        }
        
        .section-title {
            color: var(--text-primary-color);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .stat-card {
            background: var(--card-color);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .stat-info {
            color: var(--text-secondary-color);
            font-size: 14px;
        }
        
        .stat-value {
            color: var(--text-primary-color);
            font-size: 24px;
            font-weight: bold;
        }
        
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--card-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: 0 0 32px 32px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary-color);
            font-size: 10px;
            cursor: pointer;
        }
        
        .nav-item.active {
            color: var(--primary-color);
        }
        
        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
        
        /* Theme variables - will be updated dynamically */
        :root {
            --primary-color: #0E7490;
            --secondary-color: #2563EB;
            --accent-color: #F59E0B;
            --background-color: #111827;
            --card-color: #1F2937;
            --text-primary-color: #FFFFFF;
            --text-secondary-color: #CBD5E1;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="phone-screen">
            <!-- Status Bar -->
            <div class="status-bar">
                <span>9:41</span>
                <div class="status-icons">
                    <i class="fas fa-signal"></i>
                    <i class="fas fa-wifi"></i>
                    <i class="fas fa-battery-full"></i>
                </div>
            </div>

            <!-- App Header -->
            <div class="app-header">
                <div class="app-icon" id="appIcon">
                    <i class="fas fa-building"></i>
                </div>
                <div class="app-name">VVC HRM</div>
                <div class="notification-badge">
                    <i class="fas fa-bell"></i>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <div class="quick-action">
                    <div class="quick-action-icon">
                        <i class="fas fa-fingerprint"></i>
                    </div>
                    <div class="quick-action-label">Check-in</div>
                </div>
                <div class="quick-action">
                    <div class="quick-action-icon">
                        <i class="fas fa-calendar-check"></i>
                    </div>
                    <div class="quick-action-label">Leave</div>
                </div>
                <div class="quick-action">
                    <div class="quick-action-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="quick-action-label">Overtime</div>
                </div>
                <div class="quick-action">
                    <div class="quick-action-icon">
                        <i class="fas fa-file-alt"></i>
                    </div>
                    <div class="quick-action-label">Reports</div>
                </div>
            </div>

            <!-- Today's Stats -->
            <div class="today-section">
                <div class="section-title">Today's Activity</div>
                <div class="stat-card">
                    <div class="stat-info">
                        <div>Check-in Time</div>
                        <div class="stat-value">08:00 AM</div>
                    </div>
                    <div class="status-indicator">
                        <i class="fas fa-check-circle" style="color: #10B981;"></i>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <div>Working Hours</div>
                        <div class="stat-value">4h 30m</div>
                    </div>
                    <div class="status-indicator">
                        <i class="fas fa-clock" style="color: #F59E0B;"></i>
                    </div>
                </div>
            </div>

            <!-- Bottom Navigation -->
            <div class="bottom-nav">
                <div class="nav-item active">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </div>
                <div class="nav-item">
                    <i class="fas fa-calendar"></i>
                    <span>Calendar</span>
                </div>
                <div class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Team</span>
                </div>
                <div class="nav-item">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme color configurations
        const themes = {
            default: {
                primary: '#0E7490',
                secondary: '#2563EB',
                accent: '#F59E0B',
                background: '#111827',
                card: '#1F2937',
                textPrimary: '#FFFFFF',
                textSecondary: '#CBD5E1',
                icon: 'fa-building'
            },
            khmer_new_year: {
                primary: '#EAB308',
                secondary: '#CA8A04',
                accent: '#FEF08A',
                background: '#1a1a1a',
                card: '#2d2d2d',
                textPrimary: '#FFFFFF',
                textSecondary: '#FFE4B5',
                icon: 'fa-star'
            },
            pchum_ben: {
                primary: '#9333EA',
                secondary: '#7E22CE',
                accent: '#D8B4FE',
                background: '#0a0a0a',
                card: '#1a1a1a',
                textPrimary: '#FFD700',
                textSecondary: '#DAA520',
                icon: 'fa-moon'
            },
            water_festival: {
                primary: '#0284C7',
                secondary: '#0369A1',
                accent: '#7DD3FC',
                background: '#0c1929',
                card: '#1e3a5f',
                textPrimary: '#FFFFFF',
                textSecondary: '#E0F2FE',
                icon: 'fa-water'
            },
            christmas: {
                primary: '#DC2626',
                secondary: '#991B1B',
                accent: '#FCA5A5',
                background: '#1a1a2e',
                card: '#2d2d3d',
                textPrimary: '#FFFFFF',
                textSecondary: '#E8F5E9',
                icon: 'fa-gift'
            },
            valentine: {
                primary: '#DB2777',
                secondary: '#9D174D',
                accent: '#F9A8D4',
                background: '#2d1f3d',
                card: '#3d2a5c',
                textPrimary: '#FFFFFF',
                textSecondary: '#FCE7F3',
                icon: 'fa-heart'
            },
            smart_glass: {
                primary: '#6366F1',
                secondary: '#8B5CF6',
                accent: '#EC4899',
                background: '#0f172a',
                card: 'rgba(255,255,255,0.1)',
                textPrimary: '#FFFFFF',
                textSecondary: '#E2E8F0',
                icon: 'fa-glass'
            },
            lunar: {
                primary: '#1F4B99',
                secondary: '#15346A',
                accent: '#6391E2',
                background: '#0B1120',
                card: '#1E293B',
                textPrimary: '#F1F5F9',
                textSecondary: '#CBD5E1',
                icon: 'fa-moon'
            }
        };

        function updateTheme(themeId) {
            const selectedTheme = themeId || 'default';
            const theme = themes[selectedTheme];
            
            if (theme) {
                // Update CSS variables
                document.documentElement.style.setProperty('--primary-color', theme.primary);
                document.documentElement.style.setProperty('--secondary-color', theme.secondary);
                document.documentElement.style.setProperty('--accent-color', theme.accent);
                document.documentElement.style.setProperty('--background-color', theme.background);
                document.documentElement.style.setProperty('--card-color', theme.card);
                document.documentElement.style.setProperty('--text-primary-color', theme.textPrimary);
                document.documentElement.style.setProperty('--text-secondary-color', theme.textSecondary);
                
                // Update app icon
                const appIcon = document.getElementById('appIcon');
                appIcon.innerHTML = `<i class="fas ${theme.icon}"></i>`;
                appIcon.style.background = `linear-gradient(135deg, ${theme.primary}, ${theme.secondary})`;
            }
        }

        // Listen for messages from parent window
        window.addEventListener('message', function(event) {
            if (event.data && event.data.themeId) {
                updateTheme(event.data.themeId);
            }
        });

        // Make updateTheme accessible from parent window
        window.updateTheme = updateTheme;

        // Initialize with default theme
        updateTheme();
    </script>
</body>
</html>
