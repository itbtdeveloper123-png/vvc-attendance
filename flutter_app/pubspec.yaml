name: vvc_hrm
description: "A new Flutter project."
publish_to: "none"

version: 1.1.10+2604304

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  geolocator: ^13.0.0
  mobile_scanner: ^7.4.0
  intl: ^0.20.2
  google_fonts: ^8.2.0
  animate_do: ^5.1.0
  flutter_khmer_chankitec: ^0.1.0
  signature: ^6.3.0
  image_picker: ^1.2.3
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0
  file_picker: ^8.0.0
  flutter_spinkit: ^5.2.1
  dio: ^5.10.0
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.3.0
  pdf: ^3.10.0
  printing: ^5.10.0
  image: ^4.8.0
  flutter_local_notifications: ^17.2.4
  package_info_plus: ^8.0.0
  flutter_inappwebview: ^6.1.5
  pasteboard: ^0.5.0
  audioplayers: ^5.2.0
  path_provider: ^2.1.6
  path: ^1.9.0
  record: ^4.4.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  photo_view: ^0.15.0
  firebase_storage: ^12.0.0
  google_nav_bar: ^5.0.7
  google_maps_flutter: ^2.18.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.0.0
  sqflite: ^2.3.0
  connectivity_plus: ^6.1.1
  # PINNED to 6.x — connectivity_plus 7.x uses NWPath.isUltraConstrained (iOS 26 API)
  # without @available guard → compile failure on Xcode 15.4 + 16.4 (iOS 18 SDK max).
  # Bug: https://github.com/fluttercommunity/plus_plugins/issues/connectivity_plus-ios26
  # Safe 6.x API: NWPath.isConstrained (iOS 13+) — fully supported.

  socket_io_client: ^3.0.0
  cloud_firestore: ^5.4.4
  flutter_background_service: ^5.1.0
  timezone: ^0.9.0
  flutter_timezone: ^3.0.1
  local_auth: ^2.1.0
  speech_to_text: ^7.4.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: 0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: KhmerFont
      fonts:
        - asset: assets/fonts/KantumruyPro-Bold.ttf
          weight: 700

    - family: Tacteing
      fonts:
        - asset: assets/fonts/Tacteing.ttf
