name: vvc_hrm
description: "A new Flutter project."
publish_to: "none"

version: 1.1.10+2604304

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  geolocator: ^14.0.2
  mobile_scanner: ^7.4.0
  intl: ^0.20.2
  google_fonts: ^8.2.0
  animate_do: ^5.1.0
  flutter_khmer_chankitec: ^0.1.0
  signature: ^6.3.0
  image_picker: ^1.2.3
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0
  file_picker: ^8.8.0
  flutter_spinkit: ^5.2.1
  dio: ^5.10.0
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.3.0
  pdf: ^3.13.0
  printing: ^5.15.0
  image: ^4.9.1
  flutter_local_notifications: ^22.2.0
  package_info_plus: ^10.0.0
  flutter_inappwebview: ^6.1.5
  pasteboard: ^0.5.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  path: ^1.9.0
  record: ^7.1.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  photo_view: ^0.15.0
  firebase_storage: ^13.4.5
  google_nav_bar: ^5.0.7
  google_maps_flutter: ^2.18.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  sqflite: ^2.4.3
  connectivity_plus: ^7.3.1
  socket_io_client: ^3.1.6
  cloud_firestore: ^6.7.1
  flutter_background_service: ^5.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  local_auth: ^3.0.2
  speech_to_text: ^7.4.0
  flutter_secure_storage: ^10.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: KhmerFont
      fonts:
        - asset: assets/fonts/KantumruyPro-Bold.ttf
          weight: 700

    - family: Tacteing
      fonts:
        - asset: assets/fonts/Tacteing.ttf
