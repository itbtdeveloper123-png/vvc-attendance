name: vvc_hrm
description: "A new Flutter project."
publish_to: "none"

version: 1.1.10+2604304

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  crypto: ^3.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  geolocator: ^13.0.0
  mobile_scanner: ^7.4.0
  intl: ^0.20.2
  google_fonts: ^8.2.0
  animate_do: ^5.1.0
  flutter_khmer_chankitec: ^0.1.0
  signature: ^6.3.0
  image_picker: ^1.2.3
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0
  file_picker: ^8.0.0
  flutter_spinkit: ^5.2.1
  dio: ^5.10.0
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.3.0
  pdf: ^3.10.0
  printing: ^5.10.0
  image: ^4.8.0
  flutter_local_notifications: ^17.2.4
  package_info_plus: ^8.0.0
  flutter_inappwebview: ^6.1.5
  pasteboard: ^0.5.0
  audioplayers: ^5.2.0
  path_provider: ^2.1.6
  path: ^1.9.0
  record: ^4.4.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  photo_view: ^0.15.0
  lucide_icons_flutter: ^3.1.15
  lottie: ^3.1.2
  firebase_storage: ^12.0.0
  google_nav_bar: ^5.0.7
  google_maps_flutter: ^2.18.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.0.0
  sqflite: ^2.3.0
  connectivity_plus: ^6.1.1
  # PINNED to 6.x — connectivity_plus 7.x uses NWPath.isUltraConstrained (iOS 26 API)
  # without @available guard → compile failure on Xcode 15.4 + 16.4 (iOS 18 SDK max).
  # Bug: https://github.com/fluttercommunity/plus_plugins/issues/connectivity_plus-ios26
  # Safe 6.x API: NWPath.isConstrained (iOS 13+) — fully supported.

  socket_io_client: ^3.0.0
  cloud_firestore: ^5.4.4
  flutter_background_service: ^5.1.0
  timezone: ^0.9.0
  flutter_timezone: ^3.0.1
  local_auth: ^2.1.0
  flutter_secure_storage: ^10.3.1
  cunning_document_scanner: ^2.0.1
  google_mlkit_text_recognition: ^0.16.0
  google_mlkit_subject_segmentation: ^0.1.0
  google_mlkit_digital_ink_recognition: ^0.15.0
  google_generative_ai: ^0.4.6
  share_plus: ^10.1.4
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  agora_rtc_engine: ^6.5.4
  uuid: ^4.6.0
  firebase_auth: ^5.7.0
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: 0.13.1
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - assets/icons/
    - assets/fonts/
    - assets/suits/
    - assets/wallpapers/
    - assets/certificate_template/
    - assets/sticker/ColorfulMessages/
    - assets/sticker/JapaneseShiba/
    - assets/sticker/vvc-shop/
    - assets/sticker/vvc-sticker/
    - assets/sticker/Hands4Friends/
    - assets/sticker/TextAnimated/



  fonts:
    - family: KhmerFont
      fonts:
        - asset: assets/fonts/KantumruyPro-Bold.ttf
          weight: 700

    - family: Tacteing
      fonts:
        - asset: assets/fonts/Tacteing.ttf
