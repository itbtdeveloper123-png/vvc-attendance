services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bathcoder/vvc-attendance:latest
    container_name: vvc_attendance_app
    restart: always
    ports:
      - "8080:80"
    environment:
      - LOCAL_DB_SERVER=db
      - LOCAL_DB_NAME=samann1_attendance_db
      - LOCAL_DB_USERNAME=root
      - LOCAL_DB_PASSWORD=root_secure_password
      - NODE_BINARY=node
      - FFMPEG_BINARY=/usr/bin/ffmpeg
    volumes:
      - app_uploads:/var/www/html/uploads
      - app_sessions:/var/www/html/php_sessions
      # Uncomment below to mount your local .env and credentials:
      # - ./.env:/var/www/html/.env:ro
      # - ./firebase-adminsdk.json:/var/www/html/firebase-adminsdk.json:ro
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: vvc_attendance_db
    restart: always
    command:
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=300
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: samann1_attendance_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  app_uploads:
  app_sessions:
  db_data:
