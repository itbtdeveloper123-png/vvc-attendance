name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15  # Xcode 26 (iOS 26 SDK) is selected explicitly in a step below
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # device_info_plus >= 12.4 calls NSProcessInfo.isiOSAppOnVision,
      # which exists only in the iOS 26 SDK (Xcode 26+). The runner default
      # is Xcode 16.4 (iOS 18.5 SDK) → "No visible @interface" compile error.
      - name: Select latest Xcode (26+ required)
        id: xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode_*.app || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | grep -E 'Xcode_[0-9]+(\.[0-9]+)*\.app$' \
            | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            echo "ERROR: No Xcode installation found"
            exit 1
          fi
          MAJOR=$(basename "$LATEST" | sed -E 's/Xcode_([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 26 ]; then
            echo "ERROR: Xcode 26+ required, newest available is $LATEST"
            exit 1
          fi
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -n 1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          # NOTE: DO NOT set architecture: x64 on macos-14 (arm64 runner).
          # x64 forces Flutter under Rosetta 2, causing pod install/build conflicts.
          # Native arm64 Flutter works correctly on Apple Silicon runners.

      - name: Print Flutter & Dart version
        run: flutter --version

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Create local config files from examples
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cp ios/Flutter/MapsApiKey.example.xcconfig ios/Flutter/MapsApiKey.xcconfig 2>/dev/null || echo "No MapsApiKey.example.xcconfig found, skipping"
          if [ ! -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "Injecting Google Maps API Key from Secrets"
            echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" > ios/Flutter/MapsApiKey.xcconfig
          fi
          cp web/config.example.js web/config.js 2>/dev/null || echo "No config.example.js found, skipping"

      - name: Install Flutter dependencies
        run: flutter pub get
        # IMPORTANT: flutter pub get regenerates Generated.xcconfig with correct macOS CI paths.
        # Generated.xcconfig must NOT be committed to Git (already in .gitignore).

      - name: Verify Generated.xcconfig has correct macOS paths
        working-directory: flutter_app/ios/Flutter
        run: |
          echo "=== Generated.xcconfig content ==="
          cat Generated.xcconfig
          echo ""
          if grep -q "E:\\\\" Generated.xcconfig; then
            echo "ERROR: Generated.xcconfig contains Windows paths! Remove it from Git."
            exit 1
          fi
          echo "✅ Generated.xcconfig paths correct for macOS CI"

      - name: Cache CocoaPods Pods directory
        uses: actions/cache@v5
        with:
          path: flutter_app/ios/Pods
          key: ios-pods-${{ runner.os }}-${{ hashFiles('flutter_app/ios/Podfile.lock', 'flutter_app/ios/Podfile') }}
          restore-keys: |
            ios-pods-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ios-deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('flutter_app/ios/Podfile.lock', 'flutter_app/ios/Podfile') }}
          restore-keys: |
            ios-deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Install CocoaPods dependencies
        working-directory: flutter_app/ios
        env:
          FLUTTER_NO_CODESIGN: 'true'
          CI: 'true'
        run: |
          # Use --repo-update only when no Podfile.lock is cached
          # Once Podfile.lock is committed, this resolves deterministically
          pod install --repo-update

      - name: Disable Code Signing in Release.xcconfig
        run: |
          echo "" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig

      - name: Build Unsigned iOS App & IPA
        env:
          FLUTTER_NO_CODESIGN: 'true'
          CI: 'true'
          # NOTE: EXCLUDED_ARCHS is NOT set here.
          # arm64 exclusion for simulator is handled per-target in Podfile post_install.
          # Setting it globally here would break iphoneos (device) arm64 compilation.
        run: |
          set -euo pipefail

          echo "1) Building iOS Release App..."
          flutter build ios --release --no-codesign 2>&1 | tee build_flutter.log || {
            echo "Flutter build failed. Checking log..."
            cat build_flutter.log || true
            echo "Trying xcodebuild directly..."
            cd ios
            xcodebuild \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -derivedDataPath build/DerivedData \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              OTHER_CODE_SIGN_FLAGS="--keychain /dev/null" \
              2>&1 | tee ../build_flutter.log || true
            cd ..
          }

          echo "2) Locating built Runner.app..."
          APP_PATH=""
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          elif [ -d "ios/build/DerivedData/Build/Products/Release-iphoneos/Runner.app" ]; then
            APP_PATH="ios/build/DerivedData/Build/Products/Release-iphoneos/Runner.app"
          else
            echo "ERROR: Runner.app not found!"
            find . -type d -name "Runner.app" 2>/dev/null || true
            exit 1
          fi

          if [ ! -f "$APP_PATH/Runner" ]; then
            echo "ERROR: Runner binary not found inside Runner.app!"
            ls -la "$APP_PATH" || true
            exit 1
          fi

          echo "Found Runner.app at: $APP_PATH (size: $(du -sh "$APP_PATH" | cut -f1))"

          echo "2.5) Sanitizing frameworks for Sideloadly / AltStore signing..."
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -type f | while read -r file; do
              if file "$file" | grep -q "Mach-O"; then
                echo "Sanitizing Mach-O binary: $file"
                # Thin to arm64 if multiple archs exist (Sideloadly fails on fat binaries)
                archs=$(lipo -archs "$file" 2>/dev/null || echo "")
                if echo "$archs" | grep -q "arm64"; then
                  echo "Thinning $file ($archs) to arm64..."
                  lipo -thin arm64 "$file" -output "$file.thin" 2>/dev/null && mv "$file.thin" "$file" || true
                fi
                xcrun bitcode_strip -r "$file" -o "$file" 2>/dev/null || true
                strip -x "$file" 2>/dev/null || true
                # Pre-sign ad-hoc on macOS so Mach-O header space is allocated
                codesign --force --sign - "$file" 2>/dev/null || true
              fi
            done
          fi

          echo "3) Packaging into unsigned IPA..."
          mkdir -p build/ios/iphoneos/Payload
          cp -R "$APP_PATH" build/ios/iphoneos/Payload/Runner.app

          cd build/ios/iphoneos
          rm -f Runner-unsigned.ipa
          # Two-pass packaging:
          # 1) Pack everything EXCEPT Info.plist with standard zip compression & symlink preservation (-y)
          zip -qry Runner-unsigned.ipa Payload -x "*/Info.plist"
          # 2) Pack all Info.plist files UNCOMPRESSED (-0) to bypass Sideloadly 0.70+ hashing regression
          zip -qry -0 Runner-unsigned.ipa Payload -i "*/Info.plist"

          rm -rf Payload
          cd ../../..

          echo "=== IPA Created Successfully ==="
          ls -lh build/ios/iphoneos/Runner-unsigned.ipa

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: flutter_app/build_flutter.log
          if-no-files-found: ignore

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vvc-hrm-ios-unsigned
          path: flutter_app/build/ios/iphoneos/Runner-unsigned.ipa
          if-no-files-found: error
