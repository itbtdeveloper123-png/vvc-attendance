name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14  # macos-14 = Apple Silicon (arm64) runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          # NOTE: DO NOT set architecture: x64 on macos-14 (arm64 runner).
          # x64 forces Flutter under Rosetta 2, causing pod install/build conflicts.
          # Native arm64 Flutter works correctly on Apple Silicon runners.

      - name: Print Flutter & Dart version
        run: flutter --version

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Create local config files from examples
        working-directory: flutter_app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cp ios/Flutter/MapsApiKey.example.xcconfig ios/Flutter/MapsApiKey.xcconfig 2>/dev/null || echo "No MapsApiKey.example.xcconfig found, skipping"
          if [ ! -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "Injecting Google Maps API Key from Secrets"
            echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" > ios/Flutter/MapsApiKey.xcconfig
          fi
          cp web/config.example.js web/config.js 2>/dev/null || echo "No config.example.js found, skipping"

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
        # IMPORTANT: flutter pub get regenerates Generated.xcconfig with correct macOS CI paths.
        # Generated.xcconfig must NOT be committed to Git (already in .gitignore).

      - name: Verify Generated.xcconfig has correct macOS paths
        working-directory: flutter_app/ios/Flutter
        run: |
          echo "=== Generated.xcconfig content ==="
          cat Generated.xcconfig
          echo ""
          if grep -q "E:\\\\" Generated.xcconfig; then
            echo "ERROR: Generated.xcconfig contains Windows paths! Remove it from Git."
            exit 1
          fi
          echo "✅ Generated.xcconfig paths correct for macOS CI"

      - name: Cache CocoaPods Pods directory
        uses: actions/cache@v5
        with:
          path: flutter_app/ios/Pods
          key: ios-pods-${{ runner.os }}-${{ hashFiles('flutter_app/ios/Podfile.lock') }}
          restore-keys: |
            ios-pods-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ios-deriveddata-${{ runner.os }}-${{ hashFiles('flutter_app/ios/Podfile.lock') }}
          restore-keys: |
            ios-deriveddata-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        working-directory: flutter_app/ios
        env:
          FLUTTER_NO_CODESIGN: 'true'
          CI: 'true'
        run: |
          # Use --repo-update only when no Podfile.lock is cached
          # Once Podfile.lock is committed, this resolves deterministically
          pod install --repo-update

      - name: Build Unsigned iOS App & IPA
        working-directory: flutter_app
        env:
          FLUTTER_NO_CODESIGN: 'true'
          CI: 'true'
          # NOTE: EXCLUDED_ARCHS is NOT set here.
          # arm64 exclusion for simulator is handled per-target in Podfile post_install.
          # Setting it globally here would break iphoneos (device) arm64 compilation.
        run: |
          set -euo pipefail

          echo "1) Building iOS Release App..."
          flutter build ios --release --no-codesign 2>&1 | tee build_flutter.log || {
            echo "Flutter build failed. Checking log..."
            cat build_flutter.log || true
            echo "Trying xcodebuild directly..."
            cd ios
            xcodebuild \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -derivedDataPath build/DerivedData \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              2>&1 | tee ../build_flutter.log || true
            cd ..
          }

          echo "2) Locating built Runner.app..."
          APP_PATH=""
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          elif [ -d "build/DerivedData/Build/Products/Release-iphoneos/Runner.app" ]; then
            APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Runner.app"
          else
            echo "ERROR: Runner.app not found!"
            find build -type d -name "Runner.app" 2>/dev/null || true
            exit 1
          fi

          if [ ! -f "$APP_PATH/Runner" ]; then
            echo "ERROR: Runner binary not found inside Runner.app!"
            ls -la "$APP_PATH" || true
            exit 1
          fi

          echo "Found Runner.app at: $APP_PATH (size: $(du -sh "$APP_PATH" | cut -f1))"

          echo "3) Packaging into unsigned IPA..."
          mkdir -p build/ios/iphoneos/Payload
          cp -R "$APP_PATH" build/ios/iphoneos/Payload/Runner.app

          cd build/ios/iphoneos
          zip -r -q Runner-unsigned.ipa Payload
          rm -rf Payload
          cd ../../..

          echo "=== IPA Created Successfully ==="
          ls -lh build/ios/iphoneos/Runner-unsigned.ipa

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: flutter_app/build_flutter.log
          if-no-files-found: ignore

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vvc-hrm-ios-unsigned
          path: flutter_app/build/ios/iphoneos/Runner-unsigned.ipa
          if-no-files-found: error
